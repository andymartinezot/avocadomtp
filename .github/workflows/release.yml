# Builds and tests the universal AvocadoMTP.app. On a v* tag (pushed by
# scripts/release.sh) it publishes a GitHub Release with AvocadoMTP.zip and its
# sha256; pushes to main and manual runs only keep the files as an artifact.
#
# The build runs with a read-only token; only the publish job, which runs on
# tags alone, may write. Actions are pinned to commits (tag in the comment).
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # libusb: headers and library for the tests (the release links its own
      # universal build from scripts/build-libusb.sh). FUSE-T: cgofuse needs its
      # fuse.h to compile; the library itself is only loaded at run time.
      - name: Install XcodeGen, libusb and FUSE-T
        run: brew install xcodegen libusb && brew install --cask fuse-t

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' macos/project.yml)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::MARKETING_VERSION '$version' isn't X.Y.Z"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Build universal app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: UNIVERSAL=1 scripts/build-app.sh

      - name: Verify
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          app=macos/build/Build/Products/Release/AvocadoMTP.app
          helper="$app/Contents/Helpers/avocadomtp"
          for bin in "$app/Contents/MacOS/AvocadoMTP" "$helper"; do
            archs="$(lipo -archs "$bin")"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::$bin is $archs"; exit 1; }
          done
          [[ "$("$helper" version)" == "$VERSION" ]]
          codesign --verify --deep --strict "$app"
          cd macos/build && shasum -a 256 -c AvocadoMTP.zip.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AvocadoMTP-${{ steps.version.outputs.version }}
          path: |
            macos/build/AvocadoMTP.zip
            macos/build/AvocadoMTP.zip.sha256
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AvocadoMTP-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          cd dist && sha256sum -c AvocadoMTP.zip.sha256
          gh release create "$GITHUB_REF_NAME" AvocadoMTP.zip AvocadoMTP.zip.sha256 \
            --title "AvocadoMTP $VERSION" --generate-notes
