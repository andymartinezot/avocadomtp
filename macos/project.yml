name: AvocadoMTP
options:
  bundleIdPrefix: com.andymartinezot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    # Ad-hoc signed by default, so anyone can build without an Apple team.
    # scripts/build-app.sh signs with a team when DEVELOPMENT_TEAM is set.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.2"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AvocadoMTP:
    type: application
    platform: macOS
    sources: [AvocadoMTP]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andymartinezot.avocadomtp.menubar
        PRODUCT_NAME: AvocadoMTP
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AvocadoMTP
        INFOPLIST_KEY_LSUIElement: YES # menu bar only, no Dock icon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "AvocadoMTP"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Not sandboxed: the app talks to the daemon's Unix socket in
        # ~/Library/Application Support/AvocadoMTP and runs the avocadomtp CLI.
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO # the helper phase reads macos/build/helper
    postCompileScripts:
      # The avocadomtp helper (built by scripts/build-app.sh) goes in
      # Contents/Helpers, not Contents/MacOS: on case-insensitive APFS
      # "avocadomtp" would collide with "AvocadoMTP". Without it the app
      # uses an avocadomtp installed separately, as before.
      - name: Embed avocadomtp helper
        basedOnDependencyAnalysis: false
        script: |
          helper="$SRCROOT/build/helper/avocadomtp"
          dest="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          rm -rf "$dest"
          if [ -f "$helper" ]; then
            mkdir -p "$dest"
            cp "$helper" "$dest/avocadomtp"
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$dest/avocadomtp"
          fi
